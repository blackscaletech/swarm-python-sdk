name: Publish Python SDK (Manual)

# No push, tag, release, workflow_run or PR trigger can publish.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish after verification and protected-environment approval
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: pypi-publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify release source attribution
        run: sh scripts/check-attribution.sh history HEAD
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Validate exact version tag
        run: |
          python -B - <<'PY'
          import os
          from pathlib import Path
          import tomllib
          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          assert os.environ["GITHUB_REF_TYPE"] == "tag", "Select a reviewed release tag, not a branch"
          assert os.environ["GITHUB_REF_NAME"] == "v" + version, "Tag must exactly match package version"
          PY
      - name: Provision pinned packaging tools
        run: python -m pip install --disable-pip-version-check -r scripts/requirements-packaging.txt
      - name: Unit tests (zero skips)
        run: python -B scripts/test-unit.py
      - name: Build and verify distributions offline
        run: python -B scripts/test-packaged.py --dist-dir dist --evidence .local-receipts/packaged
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pypi-distributions
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    if: ${{ inputs.publish }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/swarm-sdk/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: pypi-distributions
          path: dist/
      - name: Publish approved distributions using PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@ed0c53931b1dc9bd32cbe73a98c7f6766f8a527e # v1.13.0
        with:
          packages-dir: dist/
          attestations: true
