name: Python SDK CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Provision pinned packaging tools
        run: python -m pip install --disable-pip-version-check -r scripts/requirements-packaging.txt
      - name: Unit tests (zero skips)
        run: python -B scripts/test-unit.py
      - name: Offline sdist and installed-wheel gate
        run: python -B scripts/test-packaged.py --dist-dir dist --evidence .local-receipts/packaged
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: distributions-py${{ matrix.python }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7
